# Пример настроек. Скопируйте в config.yaml и поправьте под себя.

# Откуда собирать заказы: kwork; flru — есть, но выключен: отклики там платные
# (demo — вымышленные заказы для проверки)
sources: [kwork]

# Kwork: раздел (11 — «Разработка и IT», null — все разделы) и сколько страниц по 12 заказов смотреть
kwork_category: 11
kwork_pages: 3

# Слова ниш: заказ проходит, если в заголовке или описании есть хотя бы одно
niches:
  - телеграм-бот
  - telegram-бот
  - telegram бот
  - бот
  - aiogram
  - парсер
  - парсинг
  - спарсить
  - скрипт
  - автоматизация
  - лендинг
  - сайт-визитка
  - PyQt
  - Excel
  - отчёт
  - Google Таблиц
  - API
  - собрать базу
  - сбор данных
  - выгрузк
  - сайт
  - мониторинг
  - отслеживан
  - уведомлен
  - каталог
  - кабинет
  - python
  - питон
  - скрапинг
  - selenium
  - playwright
  - google sheets
  - заявк

# Стоп-слова: заказ отсеивается, если встречается любое из них
stop_words:
  - 1С
  - 1C        # латинская C
  - Битрикс
  - Bitrix
  - WordPress
  - Tilda
  - Тильд
  - ручной ввод
  - логотип
  - накрутк
  - взлом

# Минимальный бюджет, ₽ (заказы без бюджета проходят)
min_budget_rub: 1000
# Сколько откликов уже может быть у заказа
max_offers: 50
# Порог оценки 0–10: ниже — карточка не приходит
score_threshold: 6
# Как часто проверять биржи, минут (не меньше 10)
collect_interval_min: 15

# Проекты портфолио для ссылок в откликах
portfolio:
  - name: Парсер личного кабинета по артикулам из Excel (Playwright)
    url: https://github.com/ZniKDK/cabinet-parser
    tags: [парсер, кабинет, личного кабинета, excel, артикул, playwright, selenium]
  - name: Сайт с прайсом из Google Таблицы и заявками в Telegram
    url: https://github.com/ZniKDK/sheet-site
    tags: [сайт, лендинг, google таблиц, google sheets, заявк, прайс]
  - name: Бот мониторинга новых лотов и объявлений
    url: https://github.com/ZniKDK/listing-watch
    tags: [мониторинг, отслеживан, уведомлен, аукцион, объявлен, бот]
  - name: Обходчик каталогов (PostgreSQL, Docker, очередь)
    url: https://github.com/ZniKDK/site-crawler
    tags: [парсер, каталог, сбор данных, собрать базу, postgresql, docker, скрапинг]
  - name: Telegram-бот записи клиентов
    url: https://github.com/ZniKDK/tg-lead-bot
    tags: [бот, telegram, aiogram, запись]
  - name: Парсер каталога в Excel и Google Таблицы
    url: https://github.com/ZniKDK/web-parser
    tags: [парсер, excel, google таблицы, скрипт]
  - name: Свод прайс-листов поставщиков
    url: https://github.com/ZniKDK/price-list-merger
    tags: [excel, прайс, pyqt, автоматизация]
  - name: Учёт заказов фрилансера (PyQt6 + PostgreSQL)
    url: https://github.com/ZniKDK/FreelanceDesk
    tags: [pyqt, десктоп, база данных]
  - name: Витрина демо-лендингов
    url: https://github.com/ZniKDK/landing-showcase
    tags: [лендинг, сайт, html, css, js]
  - name: Лендинг с заявками в Telegram
    url: https://github.com/ZniKDK/landing-demo
    tags: [лендинг, сайт, telegram, форма]
